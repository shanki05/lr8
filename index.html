<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Більше число</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #222;
        }

        .game {
            max-width: 700px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .players {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .player {
            flex: 1;
            padding: 20px 10px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .number {
            margin: 20px 0;
            font-size: 48px;
            font-weight: bold;
            color: #2563eb;
        }

        .score {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin: 5px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            min-height: 48px;
            margin: 20px 0;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .game {
                margin: 15px auto;
                padding: 15px;
            }

            .players {
                gap: 10px;
            }

            .player {
                padding: 15px 5px;
            }

            .number {
                font-size: 36px;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>
    <div class="game">
        <h1>Більше число</h1>
        <p>Хто отримає більше число, той виграє раунд!</p>

        <div class="players">
            <div class="player">
                <h2 id="playerName">Гравець</h2>
                <div class="number" id="playerNumber">?</div>
                <p class="score">
                    Перемоги: <span id="playerScore">0</span>
                </p>
            </div>

            <div class="player">
                <h2>Комп'ютер</h2>
                <div class="number" id="computerNumber">?</div>
                <p class="score">
                    Перемоги: <span id="computerScore">0</span>
                </p>
            </div>
        </div>

        <p id="message" aria-live="polite">
            Натисніть кнопку, щоб почати гру.
        </p>

        <button id="playButton">Наступний раунд</button>
        <button id="restartButton">Нова гра</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
